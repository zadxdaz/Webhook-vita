{% extends "base.html" %}

{% block title %}Messages for {{ whatsapp_id }}{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <!-- Client Information and Pedidos List -->
        <div class="col-md-4 d-flex flex-column bg-light p-3 border-right w-100">
            {% include 'client_info.html' %} <!-- Editable Client Information -->
        </div>

        <!-- Chat Window -->
        <div class="col-md-8 d-flex flex-column p-0">
            <div class="bg-white border-bottom p-3">
                <h1>Mensajes del numero: {{ whatsapp_id }}</h1>
            </div>
            <div id="message-window" class="flex-grow-1 p-3 bg-light overflow-auto">
                <!-- Loading Spinner -->
                <div id="loading-spinner" class="text-center d-none">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Loading...
                </div>
                <table class="table table-borderless" id="message-table">
                    <tbody id="message-body">
                        <!-- Messages will be loaded here dynamically -->
                    </tbody>
                </table>
            </div>
            <div class="d-flex p-3 bg-light border-top">
                <!-- Emoji Picker -->
                <button id="emoji-btn" class="btn btn-light mr-2">&#x1F642;</button>
                <input type="text" id="message-input" class="form-control" placeholder="Write your message..." />
                <button id="send-message-btn" class="btn btn-primary ml-2">Enviar</button>
            </div>
        </div>

        <!-- Pedidos and Transactions List -->
        <div class="col-12">
            <div class="row">
                <div class="col-6 mt-4">
                    {% include 'pedidos_list.html' %} <!-- Short List of Pedidos -->
                </div>
                <div class="col-6 mt-4">
                    {% include 'transactions_list.html' %} <!-- Short List of Transactions -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap and jQuery -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
var whatsapp_id = "{{ whatsapp_id }}";
var page = 1;
var hasMore = true;
var loadedMessageIds = [];

// Function to load messages using AJAX
function loadMessages(prepend = false) {
    if (!hasMore) return;

    $('#loading-spinner').removeClass('d-none'); // Show spinner
    $.get(`/api/messages/${whatsapp_id}`, { page: page }, function (data) {
        $('#loading-spinner').addClass('d-none'); // Hide spinner
        var messages = data.messages;
        page = data.page + 1;
        hasMore = data.has_more;

        // Prepend messages if requested (infinite scroll loading)
        messages.forEach(function (message) {
            if (!loadedMessageIds.includes(message.id)) {
                loadedMessageIds.push(message.id);
                if (prepend) {
                    prependMessage(message);
                } else {
                    appendMessage(message);
                }
            }
        });

        if (!hasMore && prepend) {
            // Optional: Show a message if no more messages are available
            $('#message-body').prepend('<tr><td class="text-center">No more messages</td></tr>');
        }
    }).fail(function() {
        $('#loading-spinner').addClass('d-none'); // Hide spinner
        alert("Failed to load messages!");
    });
}

// Helper function to append a message
function appendMessage(message) {
    var rowClass = message.direction === 'sent' ? 'text-right' : 'text-left';
    var messageClass = message.direction === 'sent' ? 'bg-success text-white' : 'bg-white border';

    $('#message-body').append(
        `<tr>
            <td class="${rowClass}">
                <div class="p-2 rounded ${messageClass}" style="max-width: 70%; display: inline-block;">
                    ${message.message}
                </div>
            </td>
        </tr>`
    );
}

// Helper function to prepend a message
function prependMessage(message) {
    var rowClass = message.direction === 'sent' ? 'text-right' : 'text-left';
    var messageClass = message.direction === 'sent' ? 'bg-success text-white' : 'bg-white border';

    $('#message-body').prepend(
        `<tr>
            <td class="${rowClass}">
                <div class="p-2 rounded ${messageClass}" style="max-width: 70%; display: inline-block;">
                    ${message.message}
                </div>
            </td>
        </tr>`
    );
}

// Attach scroll event listener for infinite scrolling
$('#message-window').on('scroll', function () {
    if ($(this).scrollTop() === 0 && hasMore) {
        loadMessages(true); // Prepend older messages
    }
});

// Send message via AJAX
$('#send-message-btn').on('click', function () {
    var messageText = $('#message-input').val();
    if (!messageText.trim()) return;

    $.ajax({
        url: `/api/send_message/${whatsapp_id}`,
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ message: messageText }),
        success: function () {
            $('#message-input').val('');
            loadMessages();
            scrollToBottom();
        },
        error: function () {
            alert('Failed to send the message.');
        }
    });
});

// Load initial messages on page load
$(document).ready(function () {
    loadMessages();
    scrollToBottom();
});

// Poll for new messages every 5 seconds
setInterval(function () {
    $.get(`/api/messages/${whatsapp_id}`, { page: 1 }, function (data) {
        var newMessages = data.messages;

        newMessages.forEach(function (message) {
            if (!loadedMessageIds.includes(message.id)) {
                loadedMessageIds.push(message.id);
                appendMessage(message);
            }
        });

        scrollToBottom();
    });
}, 5000);

// Helper function to scroll to the bottom of the chat window
function scrollToBottom() {
    $('#message-window').scrollTop($('#message-window')[0].scrollHeight);
}
</script>
<style>
    #message-window {
        max-height: 500px; /* Constrain the message box size */
        overflow-y: scroll; /* Enable vertical scrolling */
        border: 1px solid #ddd; /* Optional: Add border for visibility */
    }
</style>
{% endblock %}
